name: android-debug

# Verre debug APK, one ABI (arm64-v8a by default). Runs on a push to master and by hand
# (Actions -> android-debug -> Run workflow, where another ABI can be picked).
# The first run is the slow one (ffmpeg pack + NDK); the caches make the next ones quick.
# Output: the artifact "verre-debug-apk" on the run page.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:
    inputs:
      abi:
        description: 'Android ABI to build'
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, armeabi-v7a, x86_64, x86]

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: ${{ inputs.abi || 'arm64-v8a' }}
  # Read by buildSrc/FfmpegBuild.kt: build natives and pack ffmpeg for this ABI only.
  VERRE_ANDROID_ABIS: ${{ inputs.abi || 'arm64-v8a' }}
  # Same pins as the upstream release workflow.
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: 4d2dc9ae0c73dc5f01733f18af070412013a6a93
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The checkouts sit side by side (YMusicV4/ + ffmpeg-build/): the Gradle build reads ../ffmpeg-build/out/<slug>.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: YMusicV4

      - id: ndk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            [ -f "$ndk/source.properties" ] && break
            rm -rf "$ndk"
            [ "$attempt" -gt 1 ] && sleep $((attempt * 30))
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null || true
          done
          [ -f "$ndk/source.properties" ] || { echo "::error::sdkmanager could not install ndk;$NDK_VERSION" >&2; exit 1; }
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
      - if: steps.ndk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ${{ steps.ndk.outputs.cache-primary-key }}

      - id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-${{ env.ABI }}
          key: ffmpeg-android-${{ env.ABI }}-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        name: Build the ffmpeg pack
        working-directory: ffmpeg-build
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "$ABI"
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-${{ env.ABI }}
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Assemble the debug APK
        working-directory: YMusicV4
        run: ./gradlew :androidApp:assembleDebug :engine-js:closureJs :engine-js:closurePlayerJs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verre-debug-apk
          path: YMusicV4/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
